<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Ambient Glow Blobs -->
    <radialGradient id="indigo-glow" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rose-glow" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emerald-glow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid-dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" fill-opacity="0.3" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow-lg" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base & Glows -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid-dots)" />
  <rect width="1200" height="630" fill="url(#indigo-glow)" />
  <rect width="1200" height="630" fill="url(#rose-glow)" />
  <rect width="1200" height="630" fill="url(#emerald-glow)" />

  <!-- Outer Frame Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- LEFT HERO SECTION -->
  <g transform="translate(80, 80)">
    <!-- Logo Icon & Brand Name -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="60" height="60" rx="16" fill="#6366F1" filter="url(#shadow-glow)" />
      <path d="M 20 18 L 40 18 C 45 18 45 30 38 30 L 28 30 C 22 30 22 42 30 42 L 42 42" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="76" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">DesignFlow</text>
      <rect x="280" y="16" width="70" height="28" rx="14" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-width="1" />
      <text x="315" y="35" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC" text-anchor="middle">v1.0.0</text>
    </g>

    <!-- Headline -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#F8FAFC" letter-spacing="-0.03em">
        The Local-First Creative
      </text>
      <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#brand-grad)" letter-spacing="-0.03em">
        Direction &amp; Brand Studio
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="-0.01em">
        Zero signups. Zero cloud lock-in. 100% in-browser IndexedDB.
      </text>
      <text x="0" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="-0.01em">
        Dynamic brand kits, infinite canvas, Kanban, and markdown notes.
      </text>
    </g>

    <!-- Pill Badges -->
    <g transform="translate(0, 330)">
      <!-- Badge 1: Local-First -->
      <g transform="translate(0, 0)">
        <rect width="130" height="38" rx="19" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#10B981" />
        <text x="74" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Local-First</text>
      </g>
      <!-- Badge 2: Zero Tracking -->
      <g transform="translate(142, 0)">
        <rect width="144" height="38" rx="19" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#6366F1" />
        <text x="82" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Zero Tracking</text>
      </g>
      <!-- Badge 3: WCAG AA Audited -->
      <g transform="translate(298, 0)">
        <rect width="168" height="38" rx="19" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#EC4899" />
        <text x="94" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">WCAG AA Compliant</text>
      </g>
    </g>
  </g>

  <!-- RIGHT MOCKUP PREVIEW CARD -->
  <g transform="translate(680, 80)" filter="url(#shadow-lg)">
    <!-- Browser Window Card Shell -->
    <rect width="450" height="470" rx="18" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Title Bar -->
    <path d="M 0 18 C 0 8 8 0 18 0 L 432 0 C 442 0 450 8 450 18 L 450 44 L 0 44 Z" fill="#0F172A" />
    <circle cx="24" cy="22" r="5" fill="#EF4444" />
    <circle cx="42" cy="22" r="5" fill="#F59E0B" />
    <circle cx="60" cy="22" r="5" fill="#10B981" />
    <rect x="140" y="12" width="170" height="20" rx="10" fill="#1E293B" />
    <text x="225" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">designflow.local</text>

    <!-- Canvas Idea Nodes Mockup Inside Window -->
    <!-- Idea Node 1: Brand Strategy -->
    <g transform="translate(30, 68)">
      <rect width="170" height="110" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5" />
      <circle cx="22" cy="24" r="6" fill="#818CF8" />
      <text x="36" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#EEF2FF">Brand Strategy</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#C7D2FE">Design systems &amp;</text>
      <text x="18" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#C7D2FE">accessible typography</text>
    </g>

    <!-- Idea Node 2: Typography -->
    <g transform="translate(240, 140)">
      <rect width="180" height="110" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
      <circle cx="22" cy="24" r="6" fill="#34D399" />
      <text x="36" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ECFDF5">Font Pairing</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="11" fill="#A7F3D0">Playfair Display + Inter</text>
      <rect x="18" y="74" width="70" height="18" rx="9" fill="#047857" />
      <text x="53" y="87" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">7.8:1 AAA</text>
    </g>

    <!-- Dynamic Cubic Bézier Connecting Line -->
    <path d="M 200 123 C 220 123 220 195 240 195" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="4 4" />

    <!-- Kanban / Note Card Mockup -->
    <g transform="translate(30, 230)">
      <rect width="180" height="90" rx="12" fill="#831843" stroke="#EC4899" stroke-width="1.5" />
      <circle cx="22" cy="24" r="6" fill="#F472B6" />
      <text x="36" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FDF2F8">Client Deck PDF</text>
      <text x="18" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#FBCFE8">Ready for handoff</text>
      <rect x="18" y="64" width="56" height="16" rx="8" fill="#BE185D" />
      <text x="46" y="76" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">DONE</text>
    </g>

    <!-- Connecting line 2 -->
    <path d="M 210 275 C 225 275 225 240 240 240" fill="none" stroke="#F472B6" stroke-width="2" />

    <!-- Bottom Feature Bar Inside Mockup -->
    <g transform="translate(30, 350)">
      <rect width="390" height="88" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">100% Client-Side Privacy</text>
      <text x="20" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Export all data to JSON or full ZIP archive with one click.</text>
      <rect x="20" y="62" width="110" height="16" rx="8" fill="#1E293B" />
      <text x="75" y="74" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#38BDF8" text-anchor="middle">GDPR Article 20</text>
    </g>
  </g>
</svg>
