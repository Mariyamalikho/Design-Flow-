<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <pattern id="grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#334155" />
    </pattern>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="node-indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="node-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="node-rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="node-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <style>
      @keyframes pulsePath {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -32; }
      }
      @keyframes floatNode1 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(4px, -6px); }
      }
      @keyframes floatNode2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-5px, 5px); }
      }
      .animated-cable {
        stroke-dasharray: 6 6;
        animation: pulsePath 1.8s linear infinite;
      }
      .node-1 { animation: floatNode1 5s ease-in-out infinite; }
      .node-2 { animation: floatNode2 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas Plane -->
  <rect width="840" height="480" fill="url(#canvas-bg)" rx="16" />
  <rect width="840" height="480" fill="url(#grid-dots)" rx="16" />

  <!-- Top Toolbar -->
  <rect x="24" y="20" width="792" height="48" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="44" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Brainstorm Canvas</text>
  <rect x="180" y="32" width="60" height="24" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
  <text x="210" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">Select</text>
  
  <rect x="248" y="32" width="50" height="24" rx="6" fill="#1e293b" />
  <text x="273" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">Pan</text>

  <!-- Zoom & Grid controls -->
  <rect x="680" y="32" width="120" height="24" rx="6" fill="#1e293b" />
  <text x="740" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">Zoom: 100% · Grid: Dots</text>

  <!-- Connector Lines -->
  <!-- Line 1: Central to Right -->
  <path class="animated-cable" d="M 330 200 C 400 200, 420 150, 500 150" stroke="#6366f1" stroke-width="2.5" fill="none" opacity="0.85" />
  <!-- Line 2: Central to Bottom -->
  <path class="animated-cable" d="M 330 230 C 380 270, 420 320, 480 320" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.85" />

  <!-- Node 1: Root Concept Node -->
  <g class="node-1" transform="translate(140, 140)" filter="url(#node-shadow)">
    <rect width="190" height="130" rx="12" fill="url(#node-indigo-grad)" stroke="#6366f1" stroke-width="2" />
    <circle cx="175" cy="20" r="4" fill="#6366f1" />
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Brand Essence</text>
    <text x="18" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Minimalist, premium studio</text>
    <text x="18" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">identity with organic motion</text>
    <rect x="18" y="92" width="75" height="18" rx="4" fill="#312e81" />
    <text x="55" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#a5b4fc" text-anchor="middle">Core Identity</text>
    <circle cx="190" cy="65" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Node 2: Palette Harmonies -->
  <g class="node-2" transform="translate(500, 90)" filter="url(#node-shadow)">
    <rect width="200" height="120" rx="12" fill="url(#node-emerald-grad)" stroke="#10b981" stroke-width="2" />
    <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Color Harmony</text>
    <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">WCAG AA verified palette</text>
    
    <!-- Swatches -->
    <rect x="18" y="65" width="22" height="22" rx="4" fill="#6366f1" />
    <rect x="46" y="65" width="22" height="22" rx="4" fill="#10b981" />
    <rect x="74" y="65" width="22" height="22" rx="4" fill="#f59e0b" />
    <rect x="102" y="65" width="22" height="22" rx="4" fill="#06b6d4" />
    
    <text x="18" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34d399">Contrast: 7.8:1 (AAA)</text>
    <circle cx="0" cy="60" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Node 3: Deliverable Card -->
  <g class="node-1" transform="translate(480, 270)" filter="url(#node-shadow)">
    <rect width="210" height="125" rx="12" fill="url(#node-rose-grad)" stroke="#f43f5e" stroke-width="2" />
    <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Interactive Guidelines</text>
    <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Exportable client PDF deck</text>
    <rect x="18" y="68" width="85" height="20" rx="4" fill="#881337" />
    <text x="60" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#fda4af" text-anchor="middle">Milestone · Nov 15</text>
    <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#f43f5e">Status: In Progress</text>
    <circle cx="0" cy="50" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Reset View Indicator -->
  <rect x="24" y="426" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="89" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Reset View (0, 0)</text>
</svg>
