<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <linearGradient id="kanban-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="task-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.3" />
    </filter>
    <style>
      @keyframes taskCardFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .floating-task {
        animation: taskCardFloat 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="840" height="480" fill="url(#kanban-bg)" rx="16" />

  <!-- Kanban Header -->
  <rect x="24" y="20" width="792" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="44" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Client Deliverables Board</text>

  <rect x="520" y="32" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="585" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">View: Board · Timeline</text>

  <rect x="662" y="32" width="138" height="28" rx="6" fill="#6366f1" />
  <text x="731" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">+ Add Deliverable</text>

  <!-- Column 1: Backlog / To Do -->
  <g transform="translate(24, 90)">
    <rect width="250" height="360" rx="10" fill="#1e293b" opacity="0.65" />
    <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">To Do</text>
    <rect x="65" y="16" width="22" height="18" rx="9" fill="#334155" />
    <text x="76" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">2</text>

    <!-- Task Card 1 -->
    <g transform="translate(12, 45)" filter="url(#task-shadow)">
      <rect width="226" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="12" y="12" width="60" height="18" rx="4" fill="#312e81" />
      <text x="42" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#a5b4fc" text-anchor="middle">Identity</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Primary Logo System</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">Vector marks, dark/light lockups</text>
      <text x="12" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#ec4899">High Priority</text>
    </g>

    <!-- Task Card 2 -->
    <g transform="translate(12, 160)" filter="url(#task-shadow)">
      <rect width="226" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="12" y="12" width="55" height="18" rx="4" fill="#064e3b" />
      <text x="39" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">Brand</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Typography Specimen</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">Inter Display &amp; Geist Mono</text>
    </g>
  </g>

  <!-- Column 2: In Progress -->
  <g transform="translate(295, 90)">
    <rect width="250" height="360" rx="10" fill="#1e293b" opacity="0.65" />
    <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">In Progress</text>
    <rect x="105" y="16" width="22" height="18" rx="9" fill="#312e81" />
    <text x="116" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#a5b4fc" text-anchor="middle">1</text>

    <!-- Active Floating Task -->
    <g class="floating-task" transform="translate(12, 45)" filter="url(#task-shadow)">
      <rect width="226" height="110" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
      <rect x="12" y="12" width="70" height="18" rx="4" fill="#4c1d95" />
      <text x="47" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#d8b4fe" text-anchor="middle">Moodboard</text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Masonry Moodboard</text>
      <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">Curate visual textures &amp; packaging</text>
      <rect x="12" y="80" width="80" height="18" rx="4" fill="#1e293b" />
      <text x="52" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#f59e0b">Due: Today</text>
    </g>
  </g>

  <!-- Column 3: Completed -->
  <g transform="translate(566, 90)">
    <rect width="250" height="360" rx="10" fill="#1e293b" opacity="0.65" />
    <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Done</text>
    <rect x="60" y="16" width="22" height="18" rx="9" fill="#064e3b" />
    <text x="71" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">3</text>

    <!-- Done Card 1 -->
    <g transform="translate(12, 45)" filter="url(#task-shadow)">
      <rect width="226" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Design Brief Discovery</text>
      <text x="12" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">Client requirements &amp; goals signed</text>
      <circle cx="206" cy="28" r="8" fill="#064e3b" />
      <path d="M 203 28 L 205 30 L 210 25" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Done Card 2 -->
    <g transform="translate(12, 138)" filter="url(#task-shadow)">
      <rect width="226" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">WCAG Contrast Audit</text>
      <text x="12" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">Verified 4.5:1 AA compliance</text>
      <circle cx="206" cy="28" r="8" fill="#064e3b" />
      <path d="M 203 28 L 205 30 L 210 25" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>
