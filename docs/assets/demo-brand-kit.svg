<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <filter id="swatch-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="480" fill="url(#brand-bg)" rx="16" />

  <!-- Header -->
  <rect x="24" y="20" width="792" height="52" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="44" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f4f4f5">Brand Identity &amp; Accessible Color Harmonies</text>
  <rect x="660" y="32" width="140" height="28" rx="6" fill="#6366f1" />
  <text x="730" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Export Brand Deck (PDF)</text>

  <!-- Left: Color Palette Swatches & WCAG Check -->
  <g transform="translate(24, 90)">
    <rect width="470" height="360" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fafafa">Primary Color Palette</text>
    <text x="24" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#a1a1aa">Automated WCAG 2.1 AA legibility audit</text>

    <!-- Swatch Cards Row -->
    <g transform="translate(24, 75)">
      <!-- Swatch 1: Indigo -->
      <g filter="url(#swatch-shadow)">
        <rect width="95" height="120" rx="8" fill="#1e1e24" stroke="#27272a" stroke-width="1" />
        <rect width="95" height="60" rx="8" fill="#6366f1" />
        <text x="12" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f4f4f5">#6366F1</text>
        <text x="12" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#a1a1aa">Primary</text>
        <rect x="12" y="102" width="46" height="12" rx="3" fill="#064e3b" />
        <text x="35" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">AA 4.8:1</text>
      </g>

      <!-- Swatch 2: Emerald -->
      <g transform="translate(108, 0)" filter="url(#swatch-shadow)">
        <rect width="95" height="120" rx="8" fill="#1e1e24" stroke="#27272a" stroke-width="1" />
        <rect width="95" height="60" rx="8" fill="#10b981" />
        <text x="12" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f4f4f5">#10B981</text>
        <text x="12" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#a1a1aa">Accent</text>
        <rect x="12" y="102" width="46" height="12" rx="3" fill="#064e3b" />
        <text x="35" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">AA 5.2:1</text>
      </g>

      <!-- Swatch 3: Amber -->
      <g transform="translate(216, 0)" filter="url(#swatch-shadow)">
        <rect width="95" height="120" rx="8" fill="#1e1e24" stroke="#27272a" stroke-width="1" />
        <rect width="95" height="60" rx="8" fill="#f59e0b" />
        <text x="12" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f4f4f5">#F59E0B</text>
        <text x="12" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#a1a1aa">Highlight</text>
        <rect x="12" y="102" width="46" height="12" rx="3" fill="#064e3b" />
        <text x="35" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">AA 6.1:1</text>
      </g>

      <!-- Swatch 4: Slate Dark -->
      <g transform="translate(324, 0)" filter="url(#swatch-shadow)">
        <rect width="95" height="120" rx="8" fill="#1e1e24" stroke="#27272a" stroke-width="1" />
        <rect width="95" height="60" rx="8" fill="#090d16" />
        <text x="12" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f4f4f5">#090D16</text>
        <text x="12" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#a1a1aa">Surface</text>
        <rect x="12" y="102" width="50" height="12" rx="3" fill="#064e3b" />
        <text x="37" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">AAA 16.2:1</text>
      </g>
    </g>

    <!-- Contrast Verification Box -->
    <rect x="24" y="225" width="422" height="110" rx="8" fill="#090d16" stroke="#27272a" stroke-width="1" />
    <text x="40" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f4f4f5">WCAG 2.1 AA Compliance Score</text>
    <text x="40" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#a1a1aa">Text legibility verified against light and dark background tokens.</text>
    <rect x="40" y="288" width="130" height="24" rx="6" fill="#064e3b" />
    <text x="105" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">✓ All Contrasts Passed</text>
  </g>

  <!-- Right: Typography Pairing Preview -->
  <g transform="translate(514, 90)">
    <rect width="302" height="360" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fafafa">Typography Hierarchy</text>
    
    <g transform="translate(24, 60)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#a1a1aa">HEADING FONT (Google Fonts)</text>
      <text x="0" y="44" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f4f4f5">Playfair Display</text>
      <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#a1a1aa">Editorial elegance for hero typography</text>

      <line x1="0" y1="90" x2="254" y2="90" stroke="#27272a" stroke-width="1" />

      <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#a1a1aa">BODY FONT (Google Fonts)</text>
      <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">Inter / Plus Jakarta Sans</text>
      <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#a1a1aa">Engineered for legibility on digital displays</text>

      <line x1="0" y1="184" x2="254" y2="184" stroke="#27272a" stroke-width="1" />

      <rect x="0" y="206" width="254" height="60" rx="8" fill="#090d16" stroke="#27272a" stroke-width="1" />
      <text x="12" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6366f1">Live Google Fonts Dynamic Injection</text>
      <text x="12" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#a1a1aa">Automatic link injection with zero layout shift</text>
    </g>
  </g>
</svg>
