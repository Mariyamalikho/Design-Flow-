<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="card-header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <style>
      @keyframes stepPulse {
        0%, 100% { opacity: 0.95; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.01); }
      }
      @keyframes confettiPop1 {
        0% { transform: translate(0, 0) rotate(0deg) scale(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: translate(-70px, -140px) rotate(320deg) scale(1.2); opacity: 0; }
      }
      @keyframes confettiPop2 {
        0% { transform: translate(0, 0) rotate(0deg) scale(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: translate(85px, -150px) rotate(-280deg) scale(1.3); opacity: 0; }
      }
      @keyframes confettiPop3 {
        0% { transform: translate(0, 0) rotate(0deg) scale(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: translate(120px, -110px) rotate(220deg) scale(1.1); opacity: 0; }
      }
      @keyframes dotCycle {
        0%, 25% { fill: #818cf8; width: 24px; }
        26%, 100% { fill: #475569; width: 8px; }
      }
      .animated-card {
        animation: stepPulse 6s ease-in-out infinite;
        transform-origin: center;
      }
      .confetti-piece-1 { animation: confettiPop1 3s ease-out infinite; }
      .confetti-piece-2 { animation: confettiPop2 3s ease-out infinite 0.2s; }
      .confetti-piece-3 { animation: confettiPop3 3s ease-out infinite 0.4s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="840" height="480" fill="url(#bg-grad)" rx="16" />
  <circle cx="700" cy="80" r="180" fill="url(#glow-grad)" filter="blur(40px)" />
  <circle cx="120" cy="400" r="140" fill="url(#glow-grad)" filter="blur(30px)" />

  <!-- Confetti particles -->
  <g transform="translate(420, 260)">
    <circle class="confetti-piece-1" cx="0" cy="0" r="5" fill="#ec4899" />
    <rect class="confetti-piece-2" x="0" y="0" width="8" height="8" rx="2" fill="#f59e0b" />
    <polygon class="confetti-piece-3" points="0,0 8,12 14,4" fill="#10b981" />
    <circle class="confetti-piece-1" cx="-10" cy="-5" r="4" fill="#06b6d4" />
    <rect class="confetti-piece-2" x="-5" y="-10" width="6" height="10" rx="2" fill="#8b5cf6" />
    <polygon class="confetti-piece-3" points="-8,-4 0,-14 6,-6" fill="#f43f5e" />
  </g>

  <!-- Modal Card -->
  <g class="animated-card" filter="url(#card-shadow)">
    <rect x="140" y="55" width="560" height="370" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header Banner -->
    <path d="M 140 71 Q 140 55 156 55 L 684 55 Q 700 55 700 71 L 700 160 L 140 160 Z" fill="url(#card-header-grad)" />

    <!-- Badge & Step Number -->
    <rect x="168" y="78" width="160" height="24" rx="12" fill="rgba(255,255,255,0.2)" />
    <text x="180" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Welcome to DesignFlow</text>
    <text x="640" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.8)" text-anchor="end">Step 1 of 4</text>

    <!-- Modal Title -->
    <text x="168" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Your Creative Direction Studio</text>
    <text x="168" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.9)">A local-first, privacy-native hub for modern brand designers.</text>

    <!-- Description -->
    <text x="168" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">DesignFlow unifies brand guidelines, moodboards, visual brainstorms, and deliverable workflows.</text>

    <!-- Feature Row 1 -->
    <rect x="168" y="215" width="504" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="192" cy="238" r="14" fill="#312e81" />
    <path d="M 188 238 L 191 241 L 197 235" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="216" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">100% Local &amp; Private</text>
    <text x="216" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">All assets stored securely in client-side IndexedDB. Zero cloud tracking.</text>

    <!-- Feature Row 2 -->
    <rect x="168" y="270" width="504" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="192" cy="293" r="14" fill="#064e3b" />
    <polygon points="192,286 195,291 199,291 196,294 197,299 192,296 190,299 191,294 188,291 192,291" fill="#34d399" />
    <text x="216" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Lightning Fast Performance</text>
    <text x="216" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Instant 397 kB bundle footprint, sub-millisecond route transitions.</text>

    <!-- Feature Row 3 -->
    <rect x="168" y="325" width="504" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="192" cy="348" r="14" fill="#4c1d95" />
    <rect x="187" y="343" width="10" height="10" rx="2" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <text x="216" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">GDPR Data Portability</text>
    <text x="216" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Export all workspace projects and raw media as ZIP or JSON anytime.</text>

    <!-- Footer Controls -->
    <line x1="140" y1="385" x2="700" y2="385" stroke="#1e293b" stroke-width="1" />
    
    <!-- Dots -->
    <circle cx="180" cy="405" r="4" fill="#6366f1" />
    <circle cx="194" cy="405" r="4" fill="#475569" />
    <circle cx="208" cy="405" r="4" fill="#475569" />
    <circle cx="222" cy="405" r="4" fill="#475569" />

    <!-- Buttons -->
    <text x="560" y="409" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="end">Skip Tour</text>
    
    <rect x="584" y="392" width="88" height="26" rx="6" fill="#6366f1" />
    <text x="628" y="409" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Next Step →</text>
  </g>
</svg>
